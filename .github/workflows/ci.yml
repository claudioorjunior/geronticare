name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup env
        run: |
          echo 'DATABASE_URL="postgresql://ci:***@localhost:5432/ci-mock"' > .env.local
          echo 'AUTH_SECRET="ci-mock-secret-do-not-use"' >> .env.local
          echo 'AUTH_URL="http://localhost:3000"' >> .env.local
          echo 'NEXT_PUBLIC_APP_URL="http://localhost:3000"' >> .env.local

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Install CLI dependencies
        run: npm ci --prefix cli

      - name: Test CLI
        run: npm test --prefix cli

      - name: Check CLI syntax and lint
        run: |
          npx eslint cli
          find cli -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build -- --webpack

  cli-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CLI dependencies
        run: npm ci --prefix cli

      - name: Test CLI
        run: npm test --prefix cli
