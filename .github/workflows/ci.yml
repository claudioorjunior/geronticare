name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup env
        run: |
          echo 'DATABASE_URL="postgresql://ci:***@localhost:5432/ci-mock"' > .env.local
          echo 'AUTH_SECRET="ci-mock-secret-do-not-use"' >> .env.local
          echo 'AUTH_URL="http://localhost:3000"' >> .env.local
          echo 'NEXT_PUBLIC_APP_URL="http://localhost:3000"' >> .env.local

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
